[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]

solc_version = "0.8.33"
evm_version = "paris"

optimizer = true
optimizer_runs = 200

ffi = false
auto_detect_remappings = false

remappings = [
  "forge-std/=dependencies/forge-std-1.14.0/src/",
]

[profile.build]
out = "out"
libs = ["dependencies"]

[profile.anvil]
chain_id = 31337

[lint]
exclude_lints = [
  "asm-keccak256",
  "mixed-case-function",
  "mixed-case-variable",
  "named-struct-fields",
  "pascal-case-struct",
  "screaming-snake-case-const",
]
